<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumidor de API - Fetch vs Axios</title>
    <!--estilos -->
    <link rel="stylesheet" href="styles.css">

    <!-- Importamos Axios por CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

    <!--El contenedor principal que encapsula todo -->
    <div class="container">
        
        <!--El encabezado de la pagina -->
        <header>
            <h1>Buscador de Publicaciones</h1>
            
            <!--Seccion de controles de interaccion -->
            <div class="controls">
                <select id="apiSelection">
                    <option value="fetch">Usar Fetch</option>
                    <option value="axios">Usar Axios</option>
                </select>
                
                <input type="text" id="searchInput" placeholder="Buscar publicaciones...">
                
                <button id="fetchButton">Obtener datos</button>
            </div>
        </header>

        <!--Indicador de carga (empieza oculto con .hidden) -->
        <div id="loading" class="hidden">Cargando datos...</div>

        <!--Mensaje de error (empieza oculto) -->
        <div id="error" class="hidden"></div>

        <!--Seccion principal donde iran las tarjetas de resultados -->
        <main id="results"></main>

        <!--Seccion de navegacion para los botones de pagina -->
        <nav id="pagination"></nav>

    </div>

    <!-- Conecto el html con el main -->
    <script type="module" src="main.js"></script>
</body>
</html>
