<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumidor de API - Fetch vs Axios</title>
    <!--estilos css -->
    <link rel="stylesheet" href="styles.css">

    <!-- Importamos Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

    <!--contenedor principal -->
    <div class="container">
        
      
        <header>
            <h1>Buscador de publicaciones: </h1>
            
            <div class="controls">
                <select id="apiSelection">
                    <option value="fetch">Usar Fetch</option>
                    <option value="axios">Usar Axios</option>
                </select>
                
                <input type="text" id="searchInput" placeholder="Buscar publicaciones...">
                
                <button id="fetchButton">Obtener datos</button>
            </div>
        </header>

        <!--cargando.. (empieza oculto) -->
        <div id="loading" class="hidden">Cargando datos...</div>

        <!--Mensaje error (empieza oculto) -->
        <div id="error" class="hidden"></div>

        <!--iran las tarjetas de resultados-->
        <main id="results"></main>

        <!--seccion de navegacion,botones de pagina-->
        <nav id="pagination"></nav>

    </div>

    <!-- Conecto el html con el main -->
    <script type="module" src="main.js"></script>
</body>
</html>
